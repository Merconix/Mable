id: moe.sable.client

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: '25.08'

command: sable

finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --own-name=moe.sable.client.SingleInstance
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: xdg-utils
    buildsystem: simple
    build-commands:
      - autoreconf -fi
      - ./configure --prefix=${FLATPAK_DEST}
      - touch scripts/xdg-mime.txt
      - make -C scripts xdg-mime
      - install -Dm755 scripts/xdg-mime ${FLATPAK_DEST}/bin/xdg-mime
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xdg/xdg-utils.git
        tag: v1.2.1
        commit: 356c380ad6fecc9ce6bea1f6a77986ba67402c80

  - name: desktop-file-utils
    buildsystem: meson
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/desktop-file-utils/releases/desktop-file-utils-0.28.tar.xz
        mirror-urls:
          - http://deb.debian.org/debian/pool/main/d/desktop-file-utils/desktop-file-utils_0.28.orig.tar.xz
        sha256: 4401d4e231d842c2de8242395a74a395ca468cd96f5f610d822df33594898a70

  - name: sable
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
      - install -Dm755 sable.sh ${FLATPAK_DEST}/bin/sable
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
      - install -Dm644 moe.sable.client.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 moe.sable.client.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 64x64.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/${FLATPAK_ID}.png
      - install -Dm644 128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 256x256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
    sources:
      - type: extra-data
        filename: sable.tar.gz
        url: https://github.com/SableClient/Sable/releases/download/v1.22.4/Sable-1.22.4-linux-x86_64.tar.gz
        sha256: e83150f7ade969fbfbc26b849330167145b2621a75cc906f25c9c0d5304a1024
        size: 174342420
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/SableClient/Sable/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "Sable-" + $version + "-linux-x86_64.tar.gz")
            | .browser_download_url
          is-main-source: true
      - type: extra-data
        filename: sable.tar.gz
        url: https://github.com/SableClient/Sable/releases/download/v1.22.4/Sable-1.22.4-linux-aarch64.tar.gz
        sha256: 93ab363d0fdb305c5d059258d5074d3d13fa117e11c2e270b7e8722770d2211e
        size: 189788268
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/SableClient/Sable/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "Sable-" + $version + "-linux-aarch64.tar.gz")
            | .browser_download_url
      - type: script
        dest-filename: apply_extra
        commands:
          - set -eu
          - mkdir -p sable
          - tar --no-same-owner -xzf sable.tar.gz -C sable
          - mv sable/runtime/* sable/
          - rmdir sable/runtime
          - rm sable.tar.gz
      - type: file
        path: sable.sh
      - type: file
        url: https://raw.githubusercontent.com/SableClient/Sable/v1.22.4/LICENSE
        sha256: 4df3c306dddaaf4baffdff5ca820cc679ac8cd6dc263c6a74517783e42fa7a3b
        dest-filename: LICENSE
      - type: file
        path: moe.sable.client.desktop
      - type: file
        path: moe.sable.client.metainfo.xml
      - type: file
        path: icons/32x32.png
        dest-filename: 32x32.png
      - type: file
        path: icons/64x64.png
        dest-filename: 64x64.png
      - type: file
        path: icons/128x128.png
        dest-filename: 128x128.png
      - type: file
        path: icons/256x256.png
        dest-filename: 256x256.png
